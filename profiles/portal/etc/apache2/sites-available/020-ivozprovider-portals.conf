################################################################################
### Next-generation portals (web/portal-next)
###
### Served alongside the existing portals during the rewrite so both can be
### compared screen by screen against the same backend. At cutover these Alias
### targets replace the ones above and the `-next` suffix disappears.
################################################################################
# Platform portal (new)
Alias /platform-next /opt/irontec/ivozprovider/web/portal-next/apps/platform/dist
<Directory /opt/irontec/ivozprovider/web/portal-next/apps/platform/dist/>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
     <Limit GET HEAD POST PUT DELETE OPTIONS PATCH>
        Order allow,deny
        allow from all
        Require all granted
    </Limit>

    # Same policy as the existing portals, minus 'unsafe-eval': the new build
    # has no runtime template compilation, so nothing needs it.
    Header set Content-Security-Policy "default-src 'self' 'unsafe-inline'; style-src 'self' *.googleapis.com 'unsafe-inline'; font-src 'self' *.googleapis.com *.gstatic.com; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none';"
    Header set X-Content-Type-Options "nosniff"

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /platform-next
        RewriteRule ^/platform-next/index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /platform-next/index.html [L]
     </IfModule>

    # Hashed assets are immutable; the entry point never is.
    <FilesMatch "\.(js|css|woff2?|svg|png|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^index\.html$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</Directory>

